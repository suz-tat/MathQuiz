<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- 外枠グラデーション -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>
    
    <!-- メダルゴールドグラデーション -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>

    <!-- 内側ハイライトグラデーション -->
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#FFCA28" />
    </linearGradient>

    <!-- 星のグラデーション -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FB8C00" />
    </linearGradient>

    <!-- ドロップシャドウ -->
    <filter id="medalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- 外側シャドウ & 輪郭 -->
  <circle cx="50" cy="50" r="48" fill="url(#rimGrad)" filter="url(#medalShadow)" />
  
  <!-- 金色メインリング -->
  <circle cx="50" cy="50" r="44" fill="url(#goldGrad)" />
  
  <!-- 内側ハイライトサークル -->
  <circle cx="50" cy="50" r="37" fill="url(#innerGrad)" />
  
  <!-- 細い内枠ライン -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="#FF8F00" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6" />

  <!-- 中央の星 (Star) -->
  <polygon points="50,22 56.5,37.5 73,38 59.5,49 64.5,65 50,55 35.5,65 40.5,49 27,38 43.5,37.5"
           fill="url(#starGrad)"
           stroke="#4E342E"
           stroke-width="1.8"
           stroke-linejoin="round" />
           
  <!-- 光の反射（上部ハイライト） -->
  <path d="M 22 35 A 35 35 0 0 1 78 35 A 37 32 0 0 0 22 35 Z" fill="#FFFFFF" opacity="0.4" />
</svg>
